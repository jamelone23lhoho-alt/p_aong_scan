<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>เช็คชื่อเข้างาน · Tamca Night Party</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&family=Kanit:wght@500;600;700&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root {
    --bg1: #0a1524;
    --bg2: #05080e;
    --panel: rgba(13, 21, 33, 0.72);
    --line: rgba(120, 175, 225, 0.24);
    --ink: #e9f1f8;
    --soft: #9db4c8;
    --faint: #6a8098;
    --elec: #33a9e8;
    --ok: #47d19a;
    --warn: #e2b23c;
    --bad: #ff6f61;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Anuphan", system-ui, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(95% 55% at 50% 0%, rgba(51,169,232,0.18), transparent 60%),
      linear-gradient(180deg, var(--bg1), var(--bg2) 60%);
    background-attachment: fixed;
    min-height: 100dvh;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 20px 16px 48px; }
  header { margin-bottom: 16px; }
  h1 { font-family: "Kanit", sans-serif; font-weight: 700; font-size: 22px; margin: 0; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; backdrop-filter: blur(10px); margin-bottom: 16px; }
  input[type="text"], input[type="password"] {
    width: 100%; font-family: inherit; font-size: 15px; color: var(--ink);
    background: rgba(255,255,255,0.04); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 14px; box-sizing: border-box;
  }
  input:focus { outline: none; border-color: var(--elec); background: rgba(255,255,255,0.07); }
  .btn { width: 100%; font-family: "Kanit", sans-serif; font-weight: 600; font-size: 16px; color: #04121d;
    background: linear-gradient(180deg, #56c1f5, #1b7bc0); border: none; border-radius: 10px; padding: 14px; cursor: pointer;
    box-shadow: 0 12px 28px -14px rgba(51,169,232,0.75); }
  .btn:active { transform: translateY(1px); }
  .btn.secondary { background: rgba(255,255,255,0.06); color: var(--ink); border: 1px solid var(--line); box-shadow: none; }
  #reader { width: 100%; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); }
  #reader video { border-radius: 14px; }
  .result { border-radius: 14px; padding: 18px; margin-bottom: 16px; text-align: center; animation: pop 0.25s ease; }
  @keyframes pop { from { transform: scale(0.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .result h2 { font-family: "Kanit", sans-serif; margin: 0 0 6px; font-size: 22px; }
  .result p { margin: 2px 0; font-size: 15px; }
  .result .card-no { font-family: "Kanit", sans-serif; font-size: 30px; font-weight: 700; letter-spacing: 0.1em; margin: 6px 0; }
  .r-ok { background: rgba(71,209,154,0.14); border: 1px solid rgba(71,209,154,0.5); }
  .r-ok h2 { color: var(--ok); }
  .r-warn { background: rgba(226,178,60,0.14); border: 1px solid rgba(226,178,60,0.5); }
  .r-warn h2 { color: var(--warn); }
  .r-bad { background: rgba(255,111,97,0.14); border: 1px solid rgba(255,111,97,0.5); }
  .r-bad h2 { color: var(--bad); }
  .muted { color: var(--faint); font-size: 12.5px; }
  .divider { text-align: center; color: var(--faint); font-size: 12px; margin: 14px 0; letter-spacing: 0.1em; }
  .hidden { display: none; }
  .row { display: flex; gap: 10px; }
  .row .btn { margin: 0; }
  .lock {
    position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center;
    padding: 24px; background: rgba(4, 8, 14, 0.9); backdrop-filter: blur(10px);
  }
  .lock-card { width: 100%; max-width: 340px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 28px 22px; text-align: center; }
  .lock-card h2 { font-family: "Kanit", sans-serif; margin: 0 0 6px; font-size: 22px; }
  .lock-card p { margin: 0 0 20px; color: var(--soft); font-size: 14px; }
  .lock-card input { text-align: center; letter-spacing: 0.6em; font-family: "Kanit", sans-serif; font-size: 24px; }
  .err { color: var(--bad); font-size: 13px; margin: -6px 0 12px; min-height: 18px; }
</style>
</head>
<body>
<div class="lock" id="lock">
  <div class="lock-card">
    <h2>เช็คชื่อเข้างาน</h2>
    <p>ใส่ PIN เจ้าหน้าที่เพื่อเริ่มใช้งาน</p>
    <input type="password" id="pin" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="off" />
    <div class="err" id="err"></div>
    <button class="btn" id="unlock">เข้าสู่ระบบ</button>
  </div>
</div>

<div class="wrap">
  <header>
    <h1>เช็คชื่อเข้างาน</h1>
  </header>

  <div id="resultBox"></div>

  <div class="panel">
    <div id="reader"></div>
    <div style="height:14px"></div>
    <div class="row">
      <button class="btn" id="startBtn">เริ่มสแกน</button>
      <button class="btn secondary hidden" id="stopBtn">หยุด</button>
    </div>
    <div class="divider">หรือพิมพ์รหัสเอง</div>
    <input type="text" id="manual" placeholder="เช่น 123-a1b2c3..." />
    <button class="btn secondary" id="manualBtn">เช็คอินด้วยรหัส</button>
  </div>

  <p class="muted">ชี้กล้องไปที่ QR ของผู้เข้าร่วม ระบบจะบันทึกเวลาเข้างานและกันสแกนซ้ำให้อัตโนมัติ</p>
</div>

<script>
  var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx120fWJokmgLilQS-KeGhzxRZ5uStTe9GRYqJHxMPaWsLLvtyy_WsaoHQDLJ7SneYsCw/exec";
  var PIN_CODE = "1150";
  var scanner = null;
  var running = false;
  var processing = false;
  var lastCode = "";
  var lastAt = 0;

  var el = function (id) { return document.getElementById(id); };

  function beep(freq, dur) {
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      var o = ctx.createOscillator();
      var g = ctx.createGain();
      o.frequency.value = freq;
      o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.15, ctx.currentTime);
      o.start();
      o.stop(ctx.currentTime + dur);
    } catch (e) {}
  }

  function showResult(kind, title, info) {
    var cls = kind === "success" ? "r-ok" : kind === "already" ? "r-warn" : "r-bad";
    var html = '<div class="result ' + cls + '"><h2>' + title + '</h2>';
    if (info) {
      if (info.cardNo) html += '<div class="card-no">' + info.cardNo + '</div>';
      if (info.tier) html += '<p>' + info.tier + '</p>';
      if (info.name) html += '<p>' + info.name + '</p>';
      if (info.role) html += '<p class="muted">' + info.role + '</p>';
      if (kind === "already" && info.at) html += '<p class="muted">เข้างานแล้วเมื่อ ' + info.at + '</p>';
    }
    html += '</div>';
    el("resultBox").innerHTML = html;
    if (kind === "success") { beep(880, 0.15); if (navigator.vibrate) navigator.vibrate(120); }
    else if (kind === "already") { beep(500, 0.12); setTimeout(function () { beep(500, 0.12); }, 150); if (navigator.vibrate) navigator.vibrate([80, 60, 80]); }
    else { beep(220, 0.3); if (navigator.vibrate) navigator.vibrate(300); }
  }

  async function handleCode(code) {
    if (processing) return;
    code = String(code || "").trim();
    if (!code) return;
    var now = Date.now();
    if (code === lastCode && now - lastAt < 3000) return;
    lastCode = code; lastAt = now;
    processing = true;
    try {
      var res = await fetch(SCRIPT_URL + "?action=checkin&code=" + encodeURIComponent(code) + "&pin=" + encodeURIComponent(PIN_CODE), { cache: "no-store" });
      var d = await res.json();
      if (!d.ok) { showResult("invalid", d.error || "ผิดพลาด", null); }
      else if (d.result === "success") { showResult("success", "เช็คอินสำเร็จ", d); }
      else if (d.result === "already") { showResult("already", "สแกนซ้ำ", d); }
      else { showResult("invalid", "QR ไม่ถูกต้อง", null); }
    } catch (e) {
      showResult("invalid", "เชื่อมต่อไม่ได้", null);
    }
    setTimeout(function () { processing = false; }, 1200);
  }

  function onScan(text) { handleCode(text); }

  async function startScan() {
    if (running) return;
    scanner = new Html5Qrcode("reader");
    try {
      await scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 240, height: 240 } }, onScan);
      running = true;
      el("startBtn").classList.add("hidden");
      el("stopBtn").classList.remove("hidden");
    } catch (e) {
      showResult("invalid", "เปิดกล้องไม่ได้", null);
    }
  }

  async function stopScan() {
    if (scanner && running) {
      try { await scanner.stop(); await scanner.clear(); } catch (e) {}
      running = false;
      el("startBtn").classList.remove("hidden");
      el("stopBtn").classList.add("hidden");
    }
  }

  function tryUnlock() {
    if (el("pin").value.trim() === PIN_CODE) {
      el("lock").classList.add("hidden");
    } else {
      el("err").textContent = "PIN ไม่ถูกต้อง";
      el("pin").value = "";
    }
  }

  el("unlock").addEventListener("click", tryUnlock);
  el("pin").addEventListener("keydown", function (e) { if (e.key === "Enter") tryUnlock(); });
  el("pin").addEventListener("input", function () {
    el("err").textContent = "";
    if (el("pin").value.trim().length === 4) tryUnlock();
  });
  el("startBtn").addEventListener("click", startScan);
  el("stopBtn").addEventListener("click", stopScan);
  el("manualBtn").addEventListener("click", function () { handleCode(el("manual").value); el("manual").value = ""; });
  el("manual").addEventListener("keydown", function (e) { if (e.key === "Enter") { handleCode(el("manual").value); el("manual").value = ""; } });

  el("pin").focus();
</script>
</body>
</html>
